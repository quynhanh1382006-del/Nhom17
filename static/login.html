<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập - PetCare AI</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth"><div class="auth-card"><h1>🐾 PetCare AI</h1><p>Quản lý thú cưng & lịch chăm sóc tích hợp AI</p><div class="tabs"><button id="tabLogin" class="active">Đăng nhập</button><button id="tabRegister">Đăng ký</button></div><form id="loginForm"><input id="loginEmail" placeholder="Email" type="email" required><input id="loginPass" placeholder="Mật khẩu" type="password" required><button>Đăng nhập</button></form><form id="registerForm" class="hidden"><input id="regName" placeholder="Họ và tên" required><input id="regEmail" placeholder="Email" type="email" required><input id="regPass" placeholder="Mật khẩu (>=6 ký tự)" type="password" required><button>Đăng ký</button></form><div id="msg"></div></div><script>const $=id=>document.getElementById(id);$('tabLogin').onclick=()=>{ $('tabLogin').classList.add('active');$('tabRegister').classList.remove('active');$('loginForm').classList.remove('hidden');$('registerForm').classList.add('hidden')};$('tabRegister').onclick=()=>{ $('tabRegister').classList.add('active');$('tabLogin').classList.remove('active');$('registerForm').classList.remove('hidden');$('loginForm').classList.add('hidden')};async function post(url,body){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});let d=await r.json();if(!r.ok)throw Error(d.detail||'Có lỗi');return d}$('loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await post('/api/auth/login',{username:$('loginEmail').value,password:$('loginPass').value});localStorage.token=d.access_token;location='/'}catch(x){$('msg').textContent=x.message}};$('registerForm').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:$('regName').value,email:$('regEmail').value,password:$('regPass').value})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Có lỗi');localStorage.token=d.access_token;location='/'}catch(x){$('msg').textContent=x.message}}</script></body></html>
