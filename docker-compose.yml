services:
  pet-care-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./pet_care.db
    volumes:
      - ./pet_care.db:/app/pet_care.db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
